<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 2 Release</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .release-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 24px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .release-date {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .timer-grid {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .time-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 12px;
      min-width: 80px;
    }

    .time-box span {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .time-box label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    .released-box {
      margin-top: 10px;
    }

    .released-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #10b981;
      margin-bottom: 20px;
    }

    .btn-read {
      display: inline-block;
      padding: 14px 32px;
      background-color: #10b981;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-read:hover {
      background-color: #059669;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="release-card">
    <span class="badge">Coming Soon</span>
    <h1>Chapter 2</h1>
    <p class="release-date">Releasing September 24, 2026 at 9:00 PM</p>

    <!-- Live Countdown -->
    <div id="timer" class="timer-grid">
      <div class="time-box">
        <span id="hours">00</span>
        <label>Hours</label>
      </div>
      <div class="time-box">
        <span id="minutes">00</span>
        <label>Mins</label>
      </div>
      <div class="time-box">
        <span id="seconds">00</span>
        <label>Secs</label>
      </div>
    </div>

    <!-- Automatically unlocks at 9:00 PM -->
    <div id="released" class="released-box hidden">
      <p class="released-text">🎉 Chapter 2 is live now!</p>
      <a href="chapter-2.html" class="btn-read">Read Chapter 2</a>
    </div>
  </div>

  <script>
    // Target time: September 24, 2026 at 9:00 PM (21:00)
    const releaseTime = new Date("2026-09-24T21:00:00").getTime();

    const timerEl = document.getElementById("timer");
    const releasedEl = document.getElementById("released");
    const hoursEl = document.getElementById("hours");
    const minsEl = document.getElementById("minutes");
    const secsEl = document.getElementById("seconds");

    const updateTimer = () => {
      const now = new Date().getTime();
      const diff = releaseTime - now;

      if (diff <= 0) {
        clearInterval(interval);
        timerEl.classList.add("hidden");
        releasedEl.classList.remove("hidden");
      } else {
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        hoursEl.textContent = String(hours).padStart(2, "0");
        minsEl.textContent = String(minutes).padStart(2, "0");
        secsEl.textContent = String(seconds).padStart(2, "0");
      }
    };

    const interval = setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
