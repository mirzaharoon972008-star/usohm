<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews/Questions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2rem;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #007bff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .submit-btn {
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }

    .submit-btn:disabled {
      background-color: #94d3a2;
      cursor: not-allowed;
    }

    .reviews-section-header {
      font-size: 1.5rem;
      color: #2c3e50;
      margin-bottom: 15px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }

    .review-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 15px;
      border-left: 4px solid #007bff;
    }

    .review-card.question {
      border-left-color: #ff9800;
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .user-name {
      font-weight: bold;
      color: #2c3e50;
    }

    .type-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .type-badge.review {
      background-color: #e3f2fd;
      color: #0d47a1;
    }

    .type-badge.question {
      background-color: #fff3e0;
      color: #e65100;
    }

    .rating-stars {
      color: #ffc107;
      margin-bottom: 8px;
    }

    .review-body {
      color: #555;
      line-height: 1.5;
      white-space: pre-line;
    }

    .review-date {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 30px;
    }

    #statusMessage {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      text-align: center;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>The Untold Story Of HM - Reviews</h1>
      <p>Share your feedback or ask a question about the story.</p>
    </div>

    <!-- Submission Form -->
    <div class="card">
      <form id="reviewForm">
        <div class="form-group">
          <label for="userName">Your Name</label>
          <input type="text" id="userName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="postType">Submission Type</label>
          <select id="postType" onchange="toggleRatingField()">
            <option value="review">Review</option>
            <option value="question">Question</option>
          </select>
        </div>

        <div class="form-group" id="ratingGroup">
          <label for="userRating">Rating</label>
          <select id="userRating">
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="userMessage">Message</label>
          <textarea id="userMessage" placeholder="Write your review or question here..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        <div id="statusMessage"></div>
      </form>
    </div>

    <!-- Given Reviews Section -->
    <h2 class="reviews-section-header">Given Reviews & Questions</h2>
    <div id="reviewsList">
      <div class="empty-state">Loading reviews...</div>
    </div>
  </div>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC5-ibHpHYvBVt9PL6hKRqK6eznbWITgrA",
      authDomain: "novel-7535a.firebaseapp.com",
      projectId: "novel-7535a",
      storageBucket: "novel-7535a.firebasestorage.app",
      messagingSenderId: "731929347594",
      appId: "1:731929347594:web:afbe42ebc9faff852b01f3",
      measurementId: "G-T2WSPTZWS0"
    };

    // Initialize Firebase & Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Toggle rating field display based on selected type
    function toggleRatingField() {
      const type = document.getElementById('postType').value;
      const ratingGroup = document.getElementById('ratingGroup');
      ratingGroup.style.display = (type === 'question') ? 'none' : 'block';
    }

    // Handle Form Submission
    const reviewForm = document.getElementById('reviewForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    reviewForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('userName').value.trim();
      const type = document.getElementById('postType').value;
      const rating = document.getElementById('userRating').value;
      const message = document.getElementById('userMessage').value.trim();

      if (!name || !message) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      try {
        await db.collection('reviews').add({
          name: name,
          type: type,
          rating: type === 'review' ? parseInt(rating) : null,
          message: message,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Show Success
        showStatus('Your submission has been published successfully!', 'success');
        reviewForm.reset();
        toggleRatingField();
      } catch (error) {
        console.error("Error adding document: ", error);
        showStatus('Failed to submit. Please check your Firestore rules.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit';
      }
    });

    function showStatus(text, type) {
      statusMessage.innerText = text;
      statusMessage.className = type === 'success' ? 'status-success' : 'status-error';
      statusMessage.style.display = 'block';
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 4000);
    }

    // Real-Time Listener to fetch and display reviews
    const reviewsList = document.getElementById('reviewsList');

    db.collection('reviews')
      .orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        if (snapshot.empty) {
          reviewsList.innerHTML = '<div class="empty-state">No reviews or questions yet. Be the first to submit one!</div>';
          return;
        }

        reviewsList.innerHTML = ''; // Clear container

        snapshot.forEach((doc) => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = `review-card ${data.type}`;

          const stars = data.rating ? '⭐'.repeat(data.rating) : '';
          const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString() : 'Just now';

          card.innerHTML = `
            <div class="review-header">
              <span class="user-name">${escapeHTML(data.name)}</span>
              <span class="type-badge ${data.type}">${data.type}</span>
            </div>
            ${data.rating ? `<div class="rating-stars">${stars}</div>` : ''}
            <div class="review-body">${escapeHTML(data.message)}</div>
            <div class="review-date">${dateStr}</div>
          `;

          reviewsList.appendChild(card);
        });
      }, (error) => {
        console.error("Firestore listen error: ", error);
        reviewsList.innerHTML = '<div class="empty-state">Error loading reviews. Make sure Firestore rules allow read access.</div>';
      });

    // Helper to prevent XSS attacks
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
